# What the Amiga build of Code::Blocks takes from its Makefile.am files.
# true: automake conditions that hold (all others are false, so the
# CODEBLOCKS_NT, LINUX and DARWIN branches drop out and HAVE_* use the
# bundled copies)
true BUILD_ABBREVIATIONS BUILD_ASTYLE BUILD_AUTOSAVE BUILD_CLASSWIZARD
true BUILD_CODECOMPLETION BUILD_COMPILER BUILD_MIMEHANDLER BUILD_OPENFILESLIST
true BUILD_OCCURRENCESHIGHLIGHTING BUILD_PROJECTSIMPORTER BUILD_SCRIPTEDWIZARD BUILD_TODO
# skip: directories not built for the Amiga
skip src/build_tools      # autorevision: its header is written by the build script
skip src/tools            # cb_share_config, ConsoleRunner, CBLauncher: separate programs, later
skip src/mime             # desktop and MIME files for Linux desktops
skip src/wxsmith          # wxSmith's own headers (the plugin is a contrib one)
skip src/plugins/contrib  # contrib plugins come later, one at a time
skip src/plugins/debuggergdb  # no gdb for the Amiga yet
skip src/templates/win32
skip src/sdk/wxscintilla  # the editor is the toolkit's wxStyledTextCtrl (scripts/scicompat.py)
